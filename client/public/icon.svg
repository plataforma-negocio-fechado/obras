<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Negócio Fechado</title>
  <desc id="desc">Símbolo geométrico do Negócio Fechado</desc>
  <rect width="512" height="512" rx="96" fill="#0B3047"/>
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <!-- contorno principal: abertura característica da marca -->
    <path d="M145 386V174L384 98V310L145 386Z" stroke="#F5F1E9" stroke-width="24"/>
    <!-- assinatura laranja da base -->
    <path d="M145 386L384 310" stroke="#F15A24" stroke-width="24"/>
    <!-- haste vertical laranja -->
    <path d="M384 98V310" stroke="#F15A24" stroke-width="24"/>
    <!-- seta/fechamento no canto superior direito -->
    <path d="M384 98L418 88V174" stroke="#F5F1E9" stroke-width="20"/>
  </g>
</svg>
